# Physical CM-530 calibration template.
#
# The driver refuses to start while any joint field below is null. Fill them
# only from measurements on the real arms; never copy the simulation values in
# dual_arm_coordinator/config/sim/runtime.json into this file.
#
# Motion additionally requires status: PASS, evidence_kind: physical,
# hardware_use_allowed: true, moving_speed_verified: true and a measured
# max_step_raw. Firmware v18 (protocol 6, which the driver requires) writes Moving
# Speed with every goal; set moving_speed_verified only after the arms have been
# seen moving at the commanded speeds on v18.
#
# expected_home: the board's GET_HOME on 2026-11-13 (both arms 256,512,512,512,
# also the HOME in v18 arm_config.h); the v17 source used to say 90/590,567,712,825.
status: NOT_RUN
evidence_kind: none
hardware_use_allowed: false
moving_speed_verified: false
max_step_raw: null
expected_home:
  arm1: [256, 512, 512, 512]
  arm2: [256, 512, 512, 512]
joints:
  arm1_arm_shoulder_pan_joint: {motor_id: 17, zero_raw: null, direction: null, min_raw: null, max_raw: null}
  arm1_arm_shoulder_lift_joint: {motor_id: 3, zero_raw: null, direction: null, min_raw: null, max_raw: null}
  arm1_arm_elbow_flex_joint: {motor_id: 2, zero_raw: null, direction: null, min_raw: null, max_raw: null}
  arm1_arm_wrist_flex_joint: {motor_id: 15, zero_raw: null, direction: null, min_raw: null, max_raw: null}
  arm2_arm_shoulder_pan_joint: {motor_id: 12, zero_raw: null, direction: null, min_raw: null, max_raw: null}
  arm2_arm_shoulder_lift_joint: {motor_id: 1, zero_raw: null, direction: null, min_raw: null, max_raw: null}
  arm2_arm_elbow_flex_joint: {motor_id: 8, zero_raw: null, direction: null, min_raw: null, max_raw: null}
  arm2_arm_wrist_flex_joint: {motor_id: 16, zero_raw: null, direction: null, min_raw: null, max_raw: null}
