# PROTOTYPE ESTIMATE (2026-11-13): not measured, not calibration evidence.
#
# Real arms on estimated values (user decision 2026-11-13: run the whole flow,
# accuracy and suction success not required). Copied from config/sim/coordinator.yaml
# (field layout measured 2026-11-11); changes are marked. Never copy these into
# config/hardware/coordinator.yaml.
schema_version: 1
mode: prototype
evidence_kind: prototype_estimate
target_frame: world
home_source: calibration
journal_path: ~/.ros/dual_arm/prototype_journal.json
arms:
  arm1:
    planning_group: arm1
    controller: arm1_controller
    tcp_link: arm1_tcp
    moveit_base_frame: arm1_base_link
    vision_base_frame: arm1_base
  arm2:
    planning_group: arm2
    controller: arm2_controller
    tcp_link: arm2_tcp
    moveit_base_frame: arm2_base_link
    vision_base_frame: arm2_base
speeds:              # slower than simulation
  # 2026-11-17 (user decision): transport 0.3 -> 0.6 (0.15 -> 0.3 rad/s with the URDF 0.5 rad/s).
  # Contact moves unchanged; acceleration_scale also shapes the contact trajectories, so it stays 0.3.
  # Watch the driver log for "exceeds max_step_raw" (20 counts per scheduler cycle).
  # 2026-11-18 with firmware v18 (each AX carries a Moving Speed, so steps no longer run at
  # full speed and stop): transport 0.6 -> 1.0 (0.3 -> 0.5 rad/s, the URDF limit) and
  # acceleration 0.3 -> 0.6 (0.3 -> 0.6 rad/s2). Not yet run on the arms; if contacts misbehave,
  # put acceleration_scale back to 0.3 first. Contact speed unchanged.
  transport_scale: 1.0
  contact_scale: 0.2
  acceleration_scale: 0.6
# Field run 2026-11-13: the cup stopped about 2 mm above the cap and could not pick it, so every
# height is 2 mm lower than simulation (0.014 / 0.0243 / 0.0253 / 0.054). Lowering the surface
# with the contact keeps the "cap top <= contact" check; the cap height is unchanged.
heights:
  surface_z_m: 0.012
  cap_height_m: 0.01
  cap_radius_m: 0.0125   # 2026-11-19: caps are 25 mm diameter (simulation keeps 20 mm)
  cup_radius_m: 0.009
  contact_z_m: 0.0223
  release_z_m: 0.0233
  approach_z_m: 0.052
  pick_z_tolerance_m: 0.0015
zones:
  a_min_xy_m: [-0.30, -0.12]
  a_max_xy_m: [-0.10, 0.12]
  b_place_xy_m: [0.0, 0.0]
  # 2026-11-17: 0.05 -> 0.01, measured from arm2's taught B point. Arm 2 always goes to that pose, so an object
  # further off than about the cup radius (9 mm) cannot be picked; refuse it instead. The camera
  # adds a few mm of its own (slot chk 3-6 mm); raise this if good placements are refused.
  b_pick_tolerance_m: 0.01     # simulation 0.02
  # Field ruler measurement 2026-11-13 (env_camera_vision 6b3d5c1): slot 1 front edge 75 mm,
  # so the whole grid sits 5 mm toward the user from the simulation (y 0.050/0.015/-0.020/-0.055).
  c_slots_xy_m:
    - [0.135, 0.045]
    - [0.170, 0.045]
    - [0.135, 0.010]
    - [0.170, 0.010]
    - [0.135, -0.025]
    - [0.170, -0.025]
    - [0.135, -0.060]
    - [0.170, -0.060]
# Taught C slots (user decision 2026-11-13): arm 2 places at these joint counts instead of
# c_slots_xy_m. Last READ of each teach_arm2_C_<n>.csv, torque off, hand-guided with the cup
# pressing a cap in the slot, so each pose is the release pose. The counts go through
# calibration_prototype.yaml both ways, so the motors get exactly these counts. c_slots_xy_m
# still names the slots for the cameras. Report: scripts/teach_to_slots.py.
c_slot_teach:
  arm: arm2
  source: docs/evidence/hardware/20261118_C_TEACH/teach_arm2_C_1..7.csv, 20261111_H1/teach_arm2_C_8.csv with j1 -306 (last READ)
  # 2026-11-18 14:00-14:10 all 8 re-taught (user request), same procedure; C8 back to its 11-11 value at
  # 15:25 (user decision, model self-collision). Before: 11-11 readings with
  # j1 -306 (266/329/254/302/243/281/234/270, j2..j4 as taught 11-11).
  raw:                         # j1, j2, j3, j4
    - [272, 638, 919, 617]
    - [333, 652, 889, 618]
    - [260, 662, 867, 614]
    - [310, 678, 831, 618]
    - [250, 715, 740, 693]
    - [282, 733, 715, 696]
    - [240, 768, 633, 725]
    - [270, 803, 557, 760]   # 11-11 value: the 11-18 re-teach (276, 830, 511, 788) puts j2 past 814, where the model's link_2 hits its base
  release_lift_m: 0.0          # raise the release pose if the cup presses too hard
  arrival_tolerance_raw: 4
  # 2026-11-18 (user: 6 counts): arm 2 reached slot 7 above 5.3 counts off and faulted; release keeps 4.
  above_arrival_tolerance_raw: 6
  max_line_drift_m: 0.003      # model drift of the vertical joint line is 0.7..1.8 mm
# Taught B hand-over (user decision 2026-11-15): arm 1 puts the object down and arm 2 picks it
# up at these joint counts instead of b_place_xy_m. Last READ of each teach file, torque off,
# hand-guided to the centre of B with the cup pressing a cap (user confirmed 2026-11-15), so
# each is the contact pose. arm1 uses the redo; its first file (j1 634)
# was rejected in the record. In the model the two poses lie 8 mm apart. The camera still
# confirms that B holds one object within b_pick_tolerance_m of arm2's taught contact point
# (not b_place_xy_m, which is not where the taught hand-over happens; 2026-11-17).
b_teach:
  source: docs/evidence/hardware/20261111_H1/teach_arm1_B_2.csv, 20261118_B_TEACH/teach_arm2_B.csv (last READ)
  raw:                         # j1, j2, j3, j4
    arm1: [350, 731, 702, 697]
    arm2: [94, 704, 764, 689]    # 2026-11-18 12:53 re-taught (20261118_B_TEACH/teach_arm2_B.csv); 11-17 16:13 95, 707, 757, 700; 14:20 90, 700, 779, 683; 11-11 396, 703, 756, 700
  contact_lift_m: 0.0          # raise both contact poses if the cup presses too hard
  arrival_tolerance_raw: 4
  # 2026-11-18 (user: 6 counts): arm 1 holding a cap reached B above with j2 5.6 counts low (shoulder
  # sag under load, +7..8 counts on every held lift) and faulted. Only the above pose; contact keeps 4.
  above_arrival_tolerance_raw: 6
  max_line_drift_m: 0.003
# Zone A pick correction (user decision 2026-11-17): added to the camera's cap position before
# arm 1 picks; the zone A bounds still check the camera's value. +x points from A towards B.
# 2026-11-17: the cup missed the cap sideways; first step 2 mm towards B.
a_pick_offset_xy_m: [0.002, 0.0]
# B release lift (user decision 2026-11-17): after releasing in B, arm 1 lifts straight up from
# where its cup is (xy held, j1 not turned back to the taught count) to approach_z_m plus this.
# The taught joint-line lift pushed the object sideways.
b_release_lift_extra_m: 0.005
# Direct transfer (user decision 2026-11-17): arm 1 goes from above A straight to above B and arm 2
# from above B straight to above C, without the HOME in between (the 11-17 video: about 25 s of
# detour per object). Arm 1 takes zone B before leaving HOME; arm 2 gives it back when HOME again,
# after the camera sees B empty. Remove this line to go through HOME again.
direct_transfer: true
# Grasp wait (user decision 2026-11-17): E0 held a cap in about 1 s (on-site estimate), so a grasp
# waits 1.2 s; a release still waits gripper.vacuum_settle_s (2.0 s) to vent before the lift.
# Remove this line to wait vacuum_settle_s after a grasp again.
grasp_settle_s: 1.2
# Fixed transits (user decision 2026-11-17): a non-contact move (HOME, above A/B/C) runs the joint
# line to its target at transport speed instead of a MoveIt plan, after every waypoint passed the
# validity check and the tool stays no lower than 5 mm below the lower end (the board has no
# collision geometry). Either refusal falls back to MoveIt. Remove this line to always plan.
fixed_transits: true
# Zone A press (user decision 2026-11-17): the joint readings reached the A contact target
# (dz -0.4 mm) while the cup stayed above the cap, an error the readings cannot see (estimated
# calibration, link play). Arm 1 aims this much below contact_z_m in zone A only; first value 3 mm.
# 2026-11-17: 3 -> 6 mm; with 3 mm the cup still missed caps at y > 0 (log: joints at target).
a_press_m: 0.006
# Descent correction (user decision 2026-11-17): the cup sometimes stopped short of the cap
# and a restart helped (warm motors?). After a downward contact move, when the joint readings
# put the tool more than tolerance_m above the target, descend again by the shortfall, at most
# max_extra_m below the target and attempts times; otherwise fault. Every contact move also logs
# its target, measured height and joint errors.
descent_correction:
  tolerance_m: 0.002
  max_extra_m: 0.005
  attempts: 2
# Auto resume (user decision 2026-11-17): after a fault both arms go HOME, the task recovers and
# the remaining cycles continue, at most max_resumes times per start. An object arm 1 left in B
# stays and arm 2 takes it. Never resumes after a cancel or e-stop, while an arm may hold an
# object, or when HOME or recovery fails. Remove this block to stop after every fault again.
auto_resume:
  max_resumes: 3
# Overlapped transfer (user decision 2026-11-17, 連續搬運): arm 1 picks the next object from A
# while arm 2 carries the previous one to C, and puts it into B once arm 2 has left B. Both arms
# then move at once: MoveIt only plans (one plan at a time) and each trajectory goes straight to
# the arm's controller after reserving the x range all of its joint frames sweep, padded by
# clearance_m on each side; an arm waits up to wait_s for the other's range. In the model arm 1
# in A stays below x -0.085 and arm 2 in B above x 0.021, in C and HOME above 0.10.
# clearance_m covers half a link's width and tracking error; not measured. Zone A running empty
# ends the run. Remove this block to go back to one arm at a time.
# OFF for now (user decision 2026-11-17, speed-up step 5): merged but not yet run on Mock Serial or
# the real arms. To try it, set direct_transfer to false (the two cannot both be on) and uncomment.
# overlap:
#   clearance_m: 0.025
#   wait_s: 240.0
motion:
  planning_s: 10.0
  planning_attempts: 3
  goal_submit_s: 20.0
  motion_s: 240.0
  settle_s: 0.5
  tcp_error_limit_m: 0.01      # simulation 0.0005
  arrival_samples: 3
  arrival_timeout_s: 30.0
  joint_state_max_age_s: 1.0
  waypoint_step_m: 0.002
  waypoint_joint_jump_rad: 0.15
  max_velocity_rad_s: 0.5
  max_acceleration_rad_s2: 1.0
  max_tool_tilt_deg: 9.0
gripper:
  backend: esp32
  auto_confirm: true           # nobody confirms suction in the prototype
  reply_timeout_s: 20.0
  esp32_echo_timeout_s: 2.0
  vacuum_settle_s: 2.0         # E0 2026-11-13: ~1 s measured, 1.0 had no margin; also waited after release (2026-11-17)
  esp32_modules:               # confirmed by E0 on 2026-11-13
    arm1: 1
    arm2: 2
