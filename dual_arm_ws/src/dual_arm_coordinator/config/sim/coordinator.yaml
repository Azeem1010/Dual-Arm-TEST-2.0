# Simulation task settings. Do not copy any value into the hardware template.
# Speeds and heights mirror runtime.json; test_task_config.py fails if they drift.
# Targets, heights and timeouts come from scripts/demo_transfer_pipeline.py.
# Zone and slot positions come from scripts/generate_world.py.
schema_version: 1
mode: simulation
evidence_kind: simulation_assumed
target_frame: world
home_source: runtime_json
journal_path: ~/.ros/dual_arm/sim_journal.json
arms:
  arm1:
    planning_group: arm1
    controller: arm1_controller
    tcp_link: arm1_tcp
    moveit_base_frame: arm1_base_link
    vision_base_frame: arm1_base
  arm2:
    planning_group: arm2
    controller: arm2_controller
    tcp_link: arm2_tcp
    moveit_base_frame: arm2_base_link
    vision_base_frame: arm2_base
speeds:
  transport_scale: 1.0
  contact_scale: 0.5
  acceleration_scale: 1.0
heights:
  surface_z_m: 0.014
  cap_height_m: 0.01
  cap_radius_m: 0.01
  contact_z_m: 0.0243
  release_z_m: 0.0253
  approach_z_m: 0.054
  pick_z_tolerance_m: 0.0015
zones:
  a_min_xy_m: [0.10, -0.15]
  a_max_xy_m: [0.30, 0.15]
  b_place_xy_m: [0.0, -0.02]
  # Slots 1-8. Slot 1 is a known IK FAIL in this layout (docs/SLOT_ADJUSTMENT.md).
  c_slots_xy_m:
    - [-0.1675, -0.090]
    - [-0.1325, -0.090]
    - [-0.1675, -0.055]
    - [-0.1325, -0.055]
    - [-0.1675, -0.020]
    - [-0.1325, -0.020]
    - [-0.1675, 0.015]
    - [-0.1325, 0.015]
motion:
  planning_s: 10.0
  planning_attempts: 3
  goal_submit_s: 20.0
  motion_s: 240.0
  settle_s: 0.2
  # Half the suction plugin's 1 mm contact limit, leaving room for object offset.
  tcp_error_limit_m: 0.0005
  # Simulation choices. Hardware values must come from measurement.
  arrival_samples: 3
  # Wall-clock seconds; Gazebo runs near 0.2 times real time here.
  arrival_timeout_s: 30.0
  joint_state_max_age_s: 1.0
  waypoint_step_m: 0.002
  waypoint_joint_jump_rad: 0.15
  # URDF joint velocity limit and joint_limits.yaml acceleration limit.
  max_velocity_rad_s: 0.5
  max_acceleration_rad_s2: 1.0
gripper:
  backend: gazebo
  auto_confirm: true
  reply_timeout_s: 20.0
  # Unused by the Gazebo backend; required so the file shape matches hardware.
  esp32_echo_timeout_s: 2.0
  vacuum_settle_s: 0.0
  esp32_modules:
    arm1: 1
    arm2: 2
