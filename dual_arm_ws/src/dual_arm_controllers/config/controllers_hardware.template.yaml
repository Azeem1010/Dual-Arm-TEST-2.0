# Physical controller template. hardware.launch.py refuses this file while any
# constraint is null. Fill goals, goal_time and stopped_velocity_tolerance from
# measurements on the real arms; never copy the mock fixture values.
controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm1_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    arm2_controller:
      type: joint_trajectory_controller/JointTrajectoryController
arm1_controller:
  ros__parameters:
    joints: [arm1_arm_shoulder_pan_joint, arm1_arm_shoulder_lift_joint, arm1_arm_elbow_flex_joint, arm1_arm_wrist_flex_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    constraints:
      goal_time: null
      stopped_velocity_tolerance: null
      arm1_arm_shoulder_pan_joint: {goal: null}
      arm1_arm_shoulder_lift_joint: {goal: null}
      arm1_arm_elbow_flex_joint: {goal: null}
      arm1_arm_wrist_flex_joint: {goal: null}
arm2_controller:
  ros__parameters:
    joints: [arm2_arm_shoulder_pan_joint, arm2_arm_shoulder_lift_joint, arm2_arm_elbow_flex_joint, arm2_arm_wrist_flex_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    constraints:
      goal_time: null
      stopped_velocity_tolerance: null
      arm2_arm_shoulder_pan_joint: {goal: null}
      arm2_arm_shoulder_lift_joint: {goal: null}
      arm2_arm_elbow_flex_joint: {goal: null}
      arm2_arm_wrist_flex_joint: {goal: null}
