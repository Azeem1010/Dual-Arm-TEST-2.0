# PROTOTYPE ESTIMATE (2026-11-13): not measured, not calibration evidence.
#
# Copied from controllers_hardware.template.yaml with loose, unmeasured
# tolerances so a trajectory is not aborted by the estimated calibration.
# Used only by dual_arm_bringup/hardware_prototype.launch.py.
controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm1_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    arm2_controller:
      type: joint_trajectory_controller/JointTrajectoryController
arm1_controller:
  ros__parameters:
    joints: [arm1_arm_shoulder_pan_joint, arm1_arm_shoulder_lift_joint, arm1_arm_elbow_flex_joint, arm1_arm_wrist_flex_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    constraints:
      goal_time: 10.0
      stopped_velocity_tolerance: 0.2
      arm1_arm_shoulder_pan_joint: {goal: 0.15}
      arm1_arm_shoulder_lift_joint: {goal: 0.15}
      arm1_arm_elbow_flex_joint: {goal: 0.15}
      arm1_arm_wrist_flex_joint: {goal: 0.15}
arm2_controller:
  ros__parameters:
    joints: [arm2_arm_shoulder_pan_joint, arm2_arm_shoulder_lift_joint, arm2_arm_elbow_flex_joint, arm2_arm_wrist_flex_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    constraints:
      goal_time: 10.0
      stopped_velocity_tolerance: 0.2
      arm2_arm_shoulder_pan_joint: {goal: 0.15}
      arm2_arm_shoulder_lift_joint: {goal: 0.15}
      arm2_arm_elbow_flex_joint: {goal: 0.15}
      arm2_arm_wrist_flex_joint: {goal: 0.15}
